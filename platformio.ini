; Development setup for the KlimaLogg library.
;   pio test -e native              host unit tests
;   pio run -e t3_v161 -t upload    build + flash examples/serial_oled
[platformio]
default_envs = t3_v161
src_dir = examples/serial_oled/src

; LilyGO T3 V1.6.1 (TTGO LoRa32 V2.1_1.6), 868 MHz SX1276
[env:t3_v161]
platform = espressif32 @ 6.13.0
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
; 460800 gave "Bad data checksum" through a monitor/hub USB port.
upload_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  KlimaLogg=symlink://.
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ 4.6.2
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
test_ignore = *

[env:native]
platform = native @ 1.2.1
test_framework = unity
lib_deps =
  KlimaLogg=symlink://.
  throwtheswitch/Unity @ 2.6.1
lib_ignore = RadioLib
; library.json targets arduino/espressif32; the protocol code is plain C++.
lib_compat_mode = off
build_flags = -std=c++17 -Wall -Wextra
